[package]
name = "tauri-plugin-studyhall-native"
version = "0.1.0"
description = "Android foreground service + ongoing notification for Fretec StudyHall"
authors = ["Aether"]
edition = "2021"
links = "tauri-plugin-studyhall-native"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "tauri_plugin_studyhall_native"
