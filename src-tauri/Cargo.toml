[package]
name = "fretec-studyhall"
version = "0.1.0"
description = "Fretec StudyHall — pomodoro + study flow"
authors = ["Aether"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "fretec_studyhall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "gzip", "brotli", "deflate", "charset", "http2", "rustls-tls"] }
axum = "0.8"
http = "1"
futures-util = "0.3"
md5 = "0.7"
sha2 = "0.10"
aes = "0.8"
cbc = "0.1"
rsa = "0.9"
num-bigint = "0.4"
base64 = "0.22"
rand = "0.8"
urlencoding = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
percent-encoding = "2"
bytes = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
