[package]
name = "fretec-studyhall"
version = "0.1.0-beta.1"
description = "Fretec StudyHall — pomodoro + study flow"
authors = ["Aether"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "fretec_studyhall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "io-util"] }
axum = "0.8"
http = "1"
futures-util = "0.3"
md5 = "0.7"
sha2 = "0.10"
aes = "0.8"
cbc = "0.1"
rsa = "0.9"
num-bigint = "0.4"
base64 = "0.22"
rand = "0.8"
urlencoding = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
percent-encoding = "2"
bytes = "1"
semver = "1"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-studyhall-native = { path = "../plugins/tauri-plugin-studyhall-native" }
# Android 没有可用的 OpenSSL 开发包，使用 rustls（ring 用 NDK clang 交叉编译）。
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "gzip", "brotli", "deflate", "charset", "http2", "rustls-tls"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
# 桌面端使用系统 TLS（Windows schannel / Linux openssl），避免额外 C 工具链。
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "gzip", "brotli", "deflate", "charset", "http2", "native-tls"] }

# 免装 Visual Studio 的构建环境：vswhom-sys 的 C++ 探测用纯 Rust 空实现替代。
# embed-resource 在探测失败后会回退到路径中的 rc.exe（本机由 scripts 提供）。
[patch.crates-io]
vswhom-sys = { path = "vendor/vswhom-sys" }
